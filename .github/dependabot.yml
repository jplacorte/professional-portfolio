version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem instead of one per package keeps review effort low.
      astro:
        patterns: ['astro', '@astrojs/*']
      lint-and-format:
        patterns: ['eslint*', '@eslint/*', 'typescript-eslint', 'prettier*', 'globals']
      testing:
        patterns: ['vitest', '@playwright/*', '@axe-core/*']
      other-dev:
        dependency-type: development
        exclude-patterns:
          [
            'astro',
            '@astrojs/*',
            'eslint*',
            '@eslint/*',
            'typescript-eslint',
            'prettier*',
            'globals',
            'vitest',
            '@playwright/*',
            '@axe-core/*',
          ]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
